name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tesmart/static/kit/**"
      - "Docs/images/readme-banner.png"
      - "Docs/images/kit.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          set -euo pipefail
          mkdir -p _site/assets _site/kit
          cp site/index.html site/site.css site/site.js _site/
          cp site/kit-demo.html site/kit-demo.css site/kit-demo.js site/architecture.svg _site/
          cp Docs/images/readme-banner.png Docs/images/kit.png _site/assets/

          # Ship kit look-and-feel (CSS + SVG icons) for the interactive demo.
          rsync -a --include='*/' \
            --include='*.css' \
            --include='svg/***' \
            --exclude='*' \
            tesmart/static/kit/ _site/kit/

          # CSS lives under kit/, so strip the /static/kit/ prefix (url(svg/...)).
          find _site/kit -type f -name '*.css' -print0 \
            | xargs -0 sed -i 's|/static/kit/||g'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
