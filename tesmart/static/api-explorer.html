<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TESmart API explorer</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+" crossorigin="anonymous">
  <link rel="stylesheet" href="/static/panel.css">
</head>
<body class="api-explorer-page">

<nav class="navbar bg-body-tertiary border-bottom">
  <div class="container-fluid">
    <span class="navbar-brand fw-semibold mb-0">API explorer</span>
    <span class="small text-body-secondary">Same listener as the control panel — leave this window open while you use <code>/panel</code></span>
  </div>
</nav>

<main class="container-fluid py-3 api-explorer-main">
  <div class="row g-3 api-explorer-row">
    <div class="col-lg-5 d-flex flex-column">
      <div class="list-group api-list flex-grow-1" id="api-list" role="listbox" aria-label="API routes"></div>
    </div>
    <div class="col-lg-7 d-flex flex-column">
      <div class="input-group input-group-sm mb-2">
        <span class="input-group-text font-monospace" id="api-method">GET</span>
        <input type="text" class="form-control font-monospace" id="api-path" spellcheck="false" aria-label="Request path">
        <button type="button" class="btn btn-primary" id="api-send">Send</button>
        <button type="button" class="btn btn-outline-secondary d-none" id="api-clear-log" title="Clear the event log">Clear</button>
      </div>
      <div id="api-body-wrap">
        <label class="form-label small mb-1" for="api-body">Request body</label>
        <textarea class="form-control font-monospace api-body" id="api-body" rows="5" spellcheck="false" aria-label="Request body"></textarea>
      </div>
      <div class="form-text" id="api-hint"></div>
      <div class="d-flex justify-content-between align-items-baseline mt-3 mb-1">
        <span class="small text-body-secondary" id="api-output-label">Raw response</span>
        <span class="small font-monospace" id="api-status"></span>
      </div>
      <div class="api-response flex-grow-1 mb-0" id="api-response">
        <pre class="api-response-raw mb-0" id="api-response-raw">Choose a route and send it. The status line and body appear here, exactly as the listener returned them.</pre>
        <div class="api-event-log d-none" id="api-event-log" aria-live="polite"></div>
      </div>
    </div>
  </div>
</main>

<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="/static/panel.js"></script>
</body>
</html>
